<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خدمات آرشیو الکترونیک | دیتاپردازش خلیج فارس</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css");
  :root{
    --bg-1:#011324;--bg-2:#0c1c33;--navy-900:#0c1c33;--navy-800:#16324c;--navy-700:#1c3a58;
    --glass:rgba(255,255,255,.055);--glass-strong:rgba(255,255,255,.09);--glass-border:rgba(255,255,255,.14);--glass-border-soft:rgba(255,255,255,.07);
    --text:#f5f8fa;--text-dim:#b7c6d4;--text-dimmer:#7c8ba0;
    --teal:#2fb8c9;--teal-soft:rgba(47,184,201,.35);--teal-600:#16788f;--teal-800:#0a3c5c;
    --radius-lg:28px;--radius-md:18px;--radius-sm:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:'Vazirmatn', sans-serif;background:radial-gradient(1100px 700px at 82% -8%, rgba(47,184,201,.14), transparent 60%),radial-gradient(900px 650px at -8% 108%, rgba(22,50,76,.5), transparent 60%),linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-1));color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;}
  .blueprint{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(1200px 800px at 50% 20%, black, transparent 75%);mask-image:radial-gradient(1200px 800px at 50% 20%, black, transparent 75%);z-index:0;}
  .orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;transition:transform .6s ease-out;}
  .orb-amber{width:420px;height:420px;background:rgba(47,184,201,.22);top:-120px;left:62%;}
  .orb-teal{width:380px;height:380px;background:rgba(0,224,208,.16);bottom:-140px;left:4%;}
  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 32px 60px;}

  /* ---------- header ---------- */
  header{position:relative;z-index:20;padding:28px 0 60px;}
  .nav-capsule{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 10px;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.02));border:1px solid var(--glass-border-soft);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 55px -22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden;}
  .nav-capsule::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.14), transparent 65%);opacity:0;transition:opacity .4s ease;pointer-events:none;}
  .nav-capsule:hover::before{opacity:1;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-weight:800;font-size:15.5px;letter-spacing:.2px;padding-left:8px;white-space:nowrap;}
  .brand-badge{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, var(--teal-600), var(--teal-800));border:1px solid rgba(255,255,255,.2);box-shadow:0 0 0 5px rgba(47,184,201,.08), 0 8px 18px rgba(0,0,0,.4);overflow:hidden;}
  .brand-badge img{width:58%;height:58%;object-fit:contain;}
  .nav-links{position:relative;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:5px;}
  .nav-links a{position:relative;z-index:2;display:inline-block;padding:9px 20px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--text-dim);text-decoration:none;white-space:nowrap;transition:color .3s ease;}
  .nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--text);}
  .nav-indicator{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:linear-gradient(135deg, rgba(47,184,201,.4), rgba(0,124,240,.28));border:1px solid rgba(47,184,201,.45);box-shadow:0 0 18px rgba(47,184,201,.4);transition:transform .4s cubic-bezier(.4,0,.2,1), width .4s cubic-bezier(.4,0,.2,1), opacity .25s ease;z-index:1;pointer-events:none;opacity:0;}
  .nav-links.ready .nav-indicator{opacity:1;}
  .nav-cta{display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:linear-gradient(135deg,#00e0c6,#007cf0);color:#fff;font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;box-shadow:0 0 20px rgba(0,224,255,.45);transition:transform .25s ease, box-shadow .25s ease;flex-shrink:0;}
  .nav-cta:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(0,224,255,.6);}
  .nav-cta svg{width:13px;height:13px;transition:transform .3s ease;}
  .nav-cta:hover svg{transform:translateX(-3px);}
  @media (max-width:860px){.nav-links{display:none;}}
  @media (max-width:520px){header{padding:22px 0 46px;}.nav-capsule{border-radius:26px;padding:14px;flex-wrap:wrap;justify-content:center;gap:14px;}.brand{padding-left:0;}.nav-cta{width:100%;justify-content:center;}}

  .breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:50px;font-size:12.5px;color:rgba(255,255,255,.45);}
  .breadcrumb a{color:rgba(255,255,255,.45);text-decoration:none;transition:color .2s ease;}
  .breadcrumb a:hover{color:var(--teal);}
  .breadcrumb span.current{color:var(--teal);}

  .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--teal);letter-spacing:.5px;font-weight:600;margin-bottom:18px;justify-content:center;}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px 2px var(--teal-soft);}
  h1{font-size:clamp(30px, 4vw, 48px);font-weight:800;line-height:1.4;letter-spacing:-.5px;}
  h1 span{color:#00e0d0;text-shadow:0 0 40px rgba(5,226,200,.8);}

  .spot{position:relative;overflow:hidden;}
  .spot::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.16), transparent 62%);opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:1;}
  .spot.spot-on::before{opacity:1;}
  .spot > *{position:relative;z-index:2;}

  /* ---------- tree title ---------- */
  .tree-title{text-align:center;position:relative;padding-bottom:40px;}
  .tree-anchor{
    position:absolute;bottom:0;left:50%;transform:translate(-50%,50%);
    width:14px;height:14px;border-radius:50%;
    background:linear-gradient(135deg,#00e0c6,#007cf0);
    box-shadow:0 0 0 6px rgba(47,184,201,.12), 0 0 18px rgba(0,224,255,.7);
  }

  /* ---------- org-chart tree connectors (تکنیک کلاسیک درخت سازمانی، فقط با CSS) ---------- */
  .org-trunk{width:2px;height:44px;background:linear-gradient(180deg, var(--teal), rgba(0,124,240,.5));margin:0 auto;}

  .org-children{
    list-style:none;
    display:flex;
    justify-content:center;
    gap:34px;
    position:relative;
    padding-top:0;
  }
  .org-children > li{
    position:relative;
    padding-top:44px;
    flex:0 1 300px;
    list-style:none;
  }
  .org-children > li::before,
  .org-children > li::after{
    content:"";
    position:absolute;
    top:0;
    width:50%;
    height:44px;
    border-top:2px solid var(--teal);
  }
  .org-children > li::before{ right:50%;}
  .org-children > li.archive-project-node::before {
    width: 500px;
}

.org-children > li.archive-project-node::after {
    width: 500px;
}
  .org-children > li::after{ left:50%; border-right:none; border-left:2px solid var(--teal); }
  .org-children > li:first-child::before{ border:0 none; }
  .org-children > li:last-child::after{ border:0 none; }
  .node-drop{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:2px;
    height:44px;
    background:var(--teal);
    box-shadow:0 0 8px rgba(47,184,201,.6);
  }

  @media (max-width:820px){
    .org-children{flex-direction:column;align-items:center;gap:56px;padding-top:44px;}
    .org-children::before{
      content:"";position:absolute;top:0;right:50%;
      width:2px;height:100%;background:linear-gradient(180deg, var(--teal), rgba(0,124,240,.35));
      transform:translateX(1px);
    }
    .org-children > li{padding-top:0;flex:none;width:100%;max-width:320px;}
    .org-children > li::before,
    .org-children > li::after{ display:none; }
    .node-drop{
      top:-40px;height:40px;
    }
  }

  /* ---------- tree card ---------- */
  .tree-card{
    display:block;position:relative;border-radius:26px;overflow:hidden;
    text-decoration:none;color:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border:1px solid var(--glass-border-soft);
    backdrop-filter:blur(14px);
    box-shadow:0 20px 50px -22px rgba(0,0,0,.55);
    transition:transform .35s ease, border-color .35s ease, box-shadow .35s ease;
  }
  .tree-card:hover{transform:translateY(-8px);border-color:rgba(47,184,201,.45);box-shadow:0 28px 60px -20px rgba(0,0,0,.65);}
  .tree-media{position:relative;aspect-ratio:4/3;overflow:hidden;}
  .tree-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease;}
  .tree-card:hover .tree-media img{transform:scale(1.08);}
  .tree-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, rgba(4,20,38,.9) 100%);}
  .tree-badge{
    position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--teal-600), var(--teal-800));
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    z-index:2;
  }
  .tree-badge svg{width:19px;height:19px;stroke:#fff;}
  .tree-caption{
    position:absolute;bottom:0;right:0;left:0;padding:18px 20px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .tree-caption h3{font-size:15.5px;font-weight:700;}
  .tree-caption svg{width:16px;height:16px;stroke:var(--teal);flex-shrink:0;transition:transform .3s ease;}
  .tree-card:hover .tree-caption svg{transform:translateX(-4px);}

</style>
</head>
<body>

<div class="blueprint"></div>
<div class="orb orb-amber" id="orbAmber"></div>
<div class="orb orb-teal" id="orbTeal"></div>

<div class="wrap">

<div id="navbar-container"></div>

  <main>



    <!-- ================= TITLE (ROOT) ================= -->
    <div class="tree-title">
        <div class="eyebrow">خدمات دیتاپردازش</div>
        <h1>خدمات <span>شبکه و زیرساخت </span></h1>
        <span class="tree-anchor"></span>
    </div>

    <div class="org-trunk"></div>

    <!-- ================= TREE (3 IMAGES) ================= -->
    <ul class="org-children">

        <li>
            <span class="node-drop"></span>
            <a href="./NetworkSupport.html" class="tree-card spot">
                <div class="tree-media">
                    <img src="../../../img/new2.png" alt="طراحی و پشتیبانی">
                    <div class="tree-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </div>
                </div>
                <div class="tree-caption">
                    <h3>طراحی و پشتیبانی </h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                </div>
            </a>
        </li>

        <li class="archive-project-node">
            <span class="node-drop"></span>
            <a href="./ServiceLanding.html" class="tree-card spot">
                <div class="tree-media">
                    <img src="../../../img/new1.png" alt="نصب وراه اندازی   ">
                    <div class="tree-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></svg>
                    </div>
                </div>
                <div class="tree-caption">
                    <h3>نصب و راه اندازی</h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                </div>
            </a>
        </li>

        <li>
            <span class="node-drop"></span>
            <a href="./ActiveServices.html" class="tree-card spot">
                <div class="tree-media">
                    <img src="../../../img/activNetwork.png" alt="خدمات اکتیو">
                    <div class="tree-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </div>
                </div>
                <div class="tree-caption">
                    <h3>خدمات اکتیو</h3>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                </div>
            </a>
        </li>

    </ul>

  </main>



</div>

<div id="footer-container"></div>

<script>
  const navLinks = document.getElementById('navLinks');
  const indicator = document.getElementById('navIndicator');
  function moveIndicator(el){if(!el || !indicator) return;indicator.style.width = el.offsetWidth + 'px';indicator.style.transform = `translateX(${el.offsetLeft}px)`;}
  if(navLinks && indicator){
    const navA = navLinks.querySelectorAll('a');
    const activeLink = navLinks.querySelector('a[aria-current="page"]') || navA[0];
    requestAnimationFrame(() => { moveIndicator(activeLink); navLinks.classList.add('ready'); });
    navA.forEach(link => link.addEventListener('mouseenter', () => moveIndicator(link)));
    navLinks.addEventListener('mouseleave', () => moveIndicator(activeLink));
    window.addEventListener('resize', () => moveIndicator(navLinks.querySelector('a:hover') || activeLink));
  }
  const capsule = document.getElementById('navCapsule');
  if(capsule){
    capsule.addEventListener('mousemove', (e) => {
      const rect = capsule.getBoundingClientRect();
      capsule.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width) * 100 + '%');
      capsule.style.setProperty('--my', ((e.clientY - rect.top) / rect.height) * 100 + '%');
    });
  }
  document.querySelectorAll('.spot').forEach(card => {
    card.addEventListener('mouseenter', () => card.classList.add('spot-on'));
    card.addEventListener('mouseleave', () => card.classList.remove('spot-on'));
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width) * 100 + '%');
      card.style.setProperty('--my', ((e.clientY - rect.top) / rect.height) * 100 + '%');
    });
  });
  const orbAmber = document.getElementById('orbAmber');
  const orbTeal = document.getElementById('orbTeal');
  let rafId = null;
  document.addEventListener('mousemove', (e) => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      const px = (e.clientX / window.innerWidth - 0.5);
      const py = (e.clientY / window.innerHeight - 0.5);
      orbAmber.style.transform = `translate(${px * -30}px, ${py * -20}px)`;
      orbTeal.style.transform = `translate(${px * 24}px, ${py * 18}px)`;
      rafId = null;
    });
  });
</script>

<script src="/script.js"></script>

</body>
</html>
